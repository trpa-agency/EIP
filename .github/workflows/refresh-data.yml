name: Refresh EIP project data

on:
  schedule:
    # Nightly at 09:00 UTC (~02:00 Pacific)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # geopandas is required for the detailed-footprints dissolve —
        # without it the script falls back to the raw feed (8,500+
        # fragment features, ~3x the file size).
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests geopandas

      - name: Run pipeline
        # arcpy is unavailable on the runner; the script gates the GDB step
        # behind HAVE_ARCPY and produces data/*.json regardless.
        run: python scripts/Build_EIP_ProjectLocations.py

      - name: Commit data deltas
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/simple.json data/detailed.geojson data/projects.geojson \
                  data/projects_aspatial.json data/detailed_eips.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): nightly refresh from LakeTahoeInfo"
            git push
          fi
