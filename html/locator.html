<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Project Locator — moved</title>
  <!-- The Project Locator now lives in the maps repo (maps.trpa.gov).
       JS redirect preserves the ?eip= deep-link and hash; meta refresh is the
       no-JS fallback (query/hash dropped there). -->
  <script>
    location.replace("https://trpa-agency.github.io/maps/tools/locator.html"
      + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=https://trpa-agency.github.io/maps/tools/locator.html" />
  <link rel="canonical" href="https://trpa-agency.github.io/maps/tools/locator.html" />
</head>
<body>
  <p>The Project Locator has moved to
    <a href="https://trpa-agency.github.io/maps/tools/locator.html">trpa-agency.github.io/maps/tools/locator.html</a>.</p>
</body>
</html>
